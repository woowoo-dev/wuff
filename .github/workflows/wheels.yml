name: Wheels

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  release:
    types:
      - published

jobs:
  build_sdist:
    name: Build SDist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build SDist
        run: pipx run build --sdist

      - name: Check metadata
        run: pipx run twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz


  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS needs one runner per architecture, because cibuildwheel builds for the
        # runner's native architecture unless `archs` is set: macos-15 is arm64, macos-15-intel
        # is the last x86_64 runner. macos-14 is avoided because GitHub retires it on
        # 2 November 2026 (actions/runner-images#13518).
        # from: https://github.com/pypa/cibuildwheel/blob/main/examples/github-deploy.yml
        os: [ ubuntu-latest, windows-latest, macos-15-intel, macos-15 ]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # v4 builds CPython 3.14 wheels by default (v2.21 stopped at 3.13). It also switched
      # the default Linux image from manylinux2014 to manylinux_2_28 (glibc 2.28).
      - uses: pypa/cibuildwheel@v4.3.4

      - name: Verify clean directory
        run: git diff --exit-code
        shell: bash

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: wheelhouse/*.whl


  upload_all:
    name: Upload if release
    needs: [ build_wheels, build_sdist ]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1