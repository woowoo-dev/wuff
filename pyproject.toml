# https://github.com/pybind/cmake_example/blob/master/pyproject.toml
[build-system]
requires = [
    "setuptools>=68",
    "ninja",
    "cmake>=3.20",
]
build-backend = "setuptools.build_meta"

[tool.mypy]
files = "setup.py"
python_version = "3.10"
strict = true
show_error_codes = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["ninja"]
ignore_missing_imports = true


[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = [
    "error",
]
testpaths = ["tests"]

[tool.cibuildwheel]
# python_requires is >=3.10 and 3.9 is EOL, so do not spend CI time on cp39 wheels
# that pip would refuse to install anyway.
skip = ["cp39-*"]
test-command = "pytest {project}/tests"
test-extras = ["test"]
# Setuptools bug causes collision between pypy and cpython artifacts
before-build = "rm -rf {project}/build"

[tool.cibuildwheel.linux]
before-all = "if command -v yum; then yum install -y libatomic; elif command -v apk; then apk add --no-cache libatomic; fi"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
extend-select = [
  "B",    # flake8-bugbear
  "I",    # isort
  "PGH",  # pygrep-hooks
  "RUF",  # Ruff-specific
  "UP",   # pyupgrade
]